[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/audit",
    "crates/banking",
    "crates/billing",
    "crates/entitlements",
    "crates/fiscal",
    "crates/identity",
    "crates/infra",
    "crates/integration",
    "crates/inventory",
    "crates/kernel",
    "crates/observability",
    "crates/payments",
    "crates/portal",
    "crates/receivables",
    "crates/sales",
    "crates/worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
axum = "0.7"
jsonwebtoken = "9"
postgres = { version = "0.19", features = ["with-uuid-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
